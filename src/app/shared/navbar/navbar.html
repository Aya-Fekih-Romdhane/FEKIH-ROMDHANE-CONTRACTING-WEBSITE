<nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
     [class.navbar-scrolled]="isScrolled()"
     [class.bg-transparent]="!isScrolled()"
     [class.bg-slate-900]="!isScrolled()">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 md:h-20">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center group" (click)="closeMobile()">
        <app-logo [width]="190" [height]="56"></app-logo>
      </a>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center gap-1">
        @for (link of navLinks; track link.path) {
          <a [routerLink]="link.path"
             routerLinkActive="text-amber-400 border-b-2 border-amber-400"
             [routerLinkActiveOptions]="{ exact: link.path === '/' }"
             class="px-4 py-2 text-slate-300 hover:text-amber-400 transition-colors text-sm font-medium rounded-lg hover:bg-white/5">
            {{ link.key | t }}
          </a>
        }
      </div>

      <!-- Right Controls -->
      <div class="flex items-center gap-2">

        <!-- Language Switcher -->
        <div class="relative">
          <button (click)="toggleLangDrop()"
                  class="flex items-center gap-2 px-3 py-2 text-slate-300 hover:text-white rounded-lg hover:bg-white/10 transition text-sm">
            <span>{{ currentLangFlag() }}</span>
            <span class="hidden sm:inline font-medium">{{ currentLangLabel() }}</span>
            <svg class="w-4 h-4 transition-transform" [class.rotate-180]="langDropOpen()"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          @if (langDropOpen()) {
            <div class="absolute end-0 mt-2 w-44 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden z-50">
              @for (l of languages; track l.code) {
                <button (click)="setLanguage(l.code)"
                        class="w-full flex items-center gap-3 px-4 py-3 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition"
                        [class.bg-slate-700]="lang() === l.code"
                        [class.text-amber-400]="lang() === l.code">
                  <span>{{ l.flag }}</span>
                  <span class="font-medium">{{ l.label }}</span>
                  @if (lang() === l.code) {
                    <span class="ms-auto text-amber-400">✓</span>
                  }
                </button>
              }
            </div>
          }
        </div>

        <!-- Dark Mode Toggle -->
        <button (click)="toggleTheme()"
                class="p-2 text-slate-300 hover:text-amber-400 rounded-lg hover:bg-white/10 transition"
                [title]="isDark() ? ('common.light_mode' | t) : ('common.dark_mode' | t)">
          @if (isDark()) {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
            </svg>
          } @else {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
          }
        </button>

        <!-- Mobile Menu Button -->
        <button (click)="toggleMobile()"
                class="md:hidden p-2 text-slate-300 hover:text-white rounded-lg hover:bg-white/10 transition">
          @if (!mobileOpen()) {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          } @else {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          }
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  @if (mobileOpen()) {
    <div class="md:hidden bg-slate-900 border-t border-slate-800 px-4 pb-4">
      <div class="flex flex-col gap-1 pt-3">
        @for (link of navLinks; track link.path) {
          <a [routerLink]="link.path"
             routerLinkActive="text-amber-400 bg-amber-500/10"
             [routerLinkActiveOptions]="{ exact: link.path === '/' }"
             (click)="closeMobile()"
             class="px-4 py-3 text-slate-300 hover:text-amber-400 hover:bg-white/5 rounded-lg text-sm font-medium transition">
            {{ link.key | t }}
          </a>
        }
        <div class="mt-3 pt-3 border-t border-slate-800">
          <a routerLink="/contact"
             (click)="closeMobile()"
             class="block w-full text-center bg-amber-500 hover:bg-amber-400 text-white font-semibold px-6 py-3 rounded-lg transition">
            {{ 'common.contact_us' | t }}
          </a>
        </div>
      </div>
    </div>
  }
</nav>
